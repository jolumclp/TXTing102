<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clustering Results</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --border: #d9e2ec;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: 3.5rem 1.25rem 2.5rem;
    }

    h1 {
      font-size: 1.7rem;
      letter-spacing: -0.01em;
      margin: 0 0 0.35rem;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 2.25rem;
      font-size: 0.98rem;
    }

    ul.index {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.85rem;
    }

    a.card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease,
                  transform 0.15s ease;
    }

    a.card:hover,
    a.card:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 3px 12px rgba(37, 99, 235, 0.14);
      transform: translateY(-1px);
      outline: none;
    }

    .badge {
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(37, 99, 235, 0.25);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      white-space: nowrap;
    }

    .label { font-weight: 600; font-size: 1rem; }

    .chevron {
      margin-left: auto;
      color: var(--muted);
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 1.1rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    @media (max-width: 480px) {
      main { padding-top: 2.25rem; }
      h1 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Clustering Results</h1>
    <p class="subtitle">Interactive Cluster Graphs for the paper "TXTing 102: Finding Meaning in the Unexplored Part of the DNS TXT Record Space"</p>

    <ul class="index">
      <li>
        <a class="card" href="BIG_n25_clusters.html">
          <span class="badge">n&nbsp;=&nbsp;25</span>
          <span class="label">Merged dataset</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a class="card" href="TOP_n20_clusters.html">
          <span class="badge">n&nbsp;=&nbsp;20</span>
          <span class="label">.top</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a class="card" href="XYZ_n20_clusters.html">
          <span class="badge">n&nbsp;=&nbsp;20</span>
          <span class="label">.xyz</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
